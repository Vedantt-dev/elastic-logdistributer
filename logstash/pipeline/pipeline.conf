# =============================================================================
# QuickBite telemetry ingest pipeline
#   Kafka (platform.telemetry.v1)  ->  parse / classify / enrich / mask  ->  Elasticsearch
# =============================================================================

input {
  kafka {
    id                            => "kafka_platform_telemetry"
    bootstrap_servers             => "kafka:29092"
    topics                        => ["platform.telemetry.v1"]
    group_id                      => "logstash-telemetry-indexer"
    client_id                     => "logstash-indexer"
    # One consumer thread per partition we expect this node to own (6 partitions / 1 node,
    # capped at 3 to stay laptop friendly; each thread then owns 2 partitions).
    consumer_threads              => 3
    partition_assignment_strategy => "cooperative_sticky"
    auto_offset_reset             => "earliest"
    # Offsets are committed periodically AFTER events are handed to the persistent queue,
    # so a crash replays the uncommitted tail: at-least-once delivery.
    enable_auto_commit            => true
    auto_commit_interval_ms       => 5000
    max_poll_records              => 500
    fetch_min_bytes               => 1
    session_timeout_ms            => 30000
    # Exposes topic / partition / offset / key under [@metadata][kafka]
    decorate_events               => "basic"
    codec                         => json { charset => "UTF-8" }
  }
}

filter {

  # ---------------------------------------------------------------------------
  # 0. Poison pills: anything that is not valid JSON is routed to the dead-letter index
  # ---------------------------------------------------------------------------
  if "_jsonparsefailure" in [tags] {
    mutate {
      add_field => {
        "[deadletter][reason]"          => "json_parse_failure"
        "[deadletter][kafka_partition]" => "%{[@metadata][kafka][partition]}"
        "[deadletter][kafka_offset]"    => "%{[@metadata][kafka][offset]}"
        "[deadletter][kafka_key]"       => "%{[@metadata][kafka][key]}"
        "[@metadata][route]"            => "deadletter"
      }
    }
  } else {

    mutate { add_field => { "[@metadata][route]" => "telemetry" } }

    # -------------------------------------------------------------------------
    # 1. Event time: index on when the service produced the event, not when we saw it
    # -------------------------------------------------------------------------
    date {
      id             => "event_time_to_timestamp"
      match          => ["event_time", "ISO8601"]
      target         => "@timestamp"
      tag_on_failure => ["_event_time_parse_failure"]
    }

    # -------------------------------------------------------------------------
    # 2. Kafka lineage (which partition/offset this record came from)
    # -------------------------------------------------------------------------
    mutate {
      copy => {
        "[@metadata][kafka][topic]"     => "[kafka][topic]"
        "[@metadata][kafka][partition]" => "[kafka][partition]"
        "[@metadata][kafka][offset]"    => "[kafka][offset]"
        "[@metadata][kafka][key]"       => "[kafka][key]"
      }
    }
    mutate {
      convert => {
        "[kafka][partition]" => "integer"
        "[kafka][offset]"    => "integer"
        "status_code"        => "integer"
        "latency_ms"         => "integer"
      }
    }

    # -------------------------------------------------------------------------
    # 3. Traffic classification by HTTP status family
    # -------------------------------------------------------------------------
    if [status_code] >= 500 {
      mutate {
        add_field => { "traffic_class" => "5xx_server_error" }
        add_tag   => ["outage_signal"]
      }
    } else if [status_code] >= 400 {
      mutate { add_field => { "traffic_class" => "4xx_client_error" } }
      if [status_code] == 429 {
        mutate { add_tag => ["throttled"] }
      }
    } else if [status_code] >= 300 {
      mutate { add_field => { "traffic_class" => "3xx_redirect" } }
    } else if [status_code] >= 200 {
      mutate { add_field => { "traffic_class" => "2xx_success" } }
    } else {
      mutate { add_field => { "traffic_class" => "unknown" } }
    }

    if [user][is_bot] {
      mutate { add_tag => ["bot_traffic"] }
    }
    if [retry_count] and [retry_count] > 0 {
      mutate { add_tag => ["retried_request"] }
    }

    # -------------------------------------------------------------------------
    # 4. Enrichment: zone -> geo_point (for Kibana Maps) and service -> latency SLO
    # -------------------------------------------------------------------------
    translate {
      id          => "zone_geo_lookup"
      source      => "geo_zone"
      target      => "zone_location"
      dictionary  => {
        "Delhi"     => "28.6139,77.2090"
        "Mumbai"    => "19.0760,72.8777"
        "Bengaluru" => "12.9716,77.5946"
        "Hyderabad" => "17.3850,78.4867"
        "Chennai"   => "13.0827,80.2707"
        "Pune"      => "18.5204,73.8567"
      }
      fallback    => "20.5937,78.9629"
    }

    translate {
      id          => "service_slo_lookup"
      source      => "service"
      target      => "slo_threshold_ms"
      dictionary  => {
        "auth-vault"           => "300"
        "menu-catalog"         => "500"
        "payment-gateway"      => "3000"
        "driver-dispatcher"    => "1000"
        "notification-service" => "1500"
      }
      fallback    => "1000"
    }
    mutate { convert => { "slo_threshold_ms" => "integer" } }

    ruby {
      id   => "latency_band_slo_and_lag"
      code => '
        lat = event.get("latency_ms").to_i
        band = if lat < 100 then "fast (<100ms)"
               elsif lat < 500 then "normal (100-500ms)"
               elsif lat < 2000 then "slow (0.5-2s)"
               else "critical (>2s)"
               end
        event.set("latency_band", band)

        slo = event.get("slo_threshold_ms").to_i
        event.set("slo_breach", slo > 0 && lat > slo)

        ts = event.get("@timestamp")
        event.set("ingest_lag_ms", ((Time.now.to_f - ts.to_f) * 1000).round) if ts
      '
    }

    # -------------------------------------------------------------------------
    # 5. PII protection
    #    a) Pseudonymise the UPI VPA with a keyed HMAC so analysts can still count
    #       "distinct payers" or join on the same payer without seeing the VPA.
    #    b) Mask structured PII fields.
    #    c) Scrub free-text `message` for anything that slipped through
    #       (raw card PANs, VPAs, phone numbers, card tokens, expiry dates).
    # -------------------------------------------------------------------------
    if [payment][upi_id] {
      fingerprint {
        id     => "upi_hmac"
        source => "[payment][upi_id]"
        target => "[payment][upi_fingerprint]"
        method => "SHA256"
        key    => "bda-telemetry-demo-pepper"
      }
      mutate {
        id   => "mask_upi_field"
        gsub => ["[payment][upi_id]", "^(.{2})[^@]*@", "\1****@"]
      }
    }

    if [payment][card_token] {
      mutate {
        id   => "mask_card_token_field"
        gsub => ["[payment][card_token]", "^tok_([a-f0-9]{4})[a-f0-9]+([a-f0-9]{4})$", "tok_\1****************\2"]
      }
    }

    if [user][phone] {
      mutate {
        id   => "mask_phone_field"
        gsub => ["[user][phone]", "^\+91 (\d{2})\d{6}(\d{2})$", "+91 \1******\2"]
      }
    }

    if [client_ip] {
      mutate {
        id   => "truncate_client_ip"
        gsub => ["client_ip", "\.\d{1,3}$", ".0"]
      }
    }

    mutate {
      id   => "scrub_pan_in_message"
      gsub => ["message", "\b(\d{4})\d{8}(\d{4})\b", "\1********\2"]
    }
    mutate {
      id   => "scrub_upi_in_message"
      gsub => ["message", "\b([A-Za-z0-9])[A-Za-z0-9._-]+@(ok[a-z]+|ybl|paytm|ibl|axl|upi)\b", "\1****@\2"]
    }
    mutate {
      id   => "scrub_phone_in_message"
      gsub => ["message", "\+91 (\d{2})\d{6}(\d{2})", "+91 \1******\2"]
    }
    mutate {
      id   => "scrub_token_in_message"
      gsub => ["message", "tok_([a-f0-9]{4})[a-f0-9]{16}([a-f0-9]{4})", "tok_\1****************\2"]
    }
    mutate {
      id   => "scrub_expiry_in_message"
      gsub => ["message", "exp=\d{2}/\d{2}", "exp=**/**"]
    }

    mutate {
      add_tag      => ["pii_scrubbed"]
      remove_field => ["@version"]
    }
  }
}

output {
  if [@metadata][route] == "deadletter" {
    elasticsearch {
      id               => "es_deadletter"
      hosts            => ["http://elasticsearch:9200"]
      index            => "deadletter-telemetry-%{+YYYY.MM.dd}"
      manage_template  => false
      ilm_enabled      => false
      data_stream      => "false"
    }
  } else {
    elasticsearch {
      id               => "es_telemetry"
      hosts            => ["http://elasticsearch:9200"]
      # Daily time-based indices; lifecycle policy deletes them after 3 days.
      index            => "telemetry-%{+YYYY.MM.dd}"
      # event_id as _id makes redelivered (at-least-once) events overwrite instead of duplicate.
      document_id      => "%{event_id}"
      action           => "index"
      manage_template  => false
      ilm_enabled      => false
      data_stream      => "false"
    }
  }
}
